{{define "content"}}
<section class="card narrow">
  <h2>Two-factor authentication</h2>
  <p class="muted">Enter the six-digit code from your authenticator app, or one of your recovery codes.</p>
  <form method="post" action="/login/code" class="stack">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required autofocus></label>
    <button class="btn primary">Log in</button>
  </form>
  <p class="muted small"><a href="/login">Start over</a></p>
</section>
{{end}}
